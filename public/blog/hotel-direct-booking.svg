<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Himalayan ridge line (Uttarakhand tourism motif) -->
  <path d="M 60 210 L 200 110 L 320 180 L 470 80 L 600 170 L 760 100 L 900 190 L 1040 140 L 1140 210" fill="none" stroke="#1e3a5f" stroke-width="3"/>
  <circle cx="470" cy="80" r="6" fill="#38bdf8"/>

  <!-- OTA path: commission taken -->
  <g transform="translate(140, 260)">
    <rect x="0" y="0" width="220" height="56" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <text x="110" y="33" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">GUEST</text>
    <line x1="220" y1="28" x2="285" y2="28" stroke="#334155" stroke-width="2"/>
    <rect x="285" y="0" width="260" height="56" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="415" y="25" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="12">OTA PLATFORM</text>
    <text x="415" y="44" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">commission on every night</text>
    <line x1="545" y1="28" x2="610" y2="28" stroke="#334155" stroke-width="2"/>
    <rect x="610" y="0" width="220" height="56" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <text x="720" y="33" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">HOTEL</text>
  </g>

  <!-- Direct path: margin retained -->
  <g transform="translate(140, 380)">
    <rect x="0" y="0" width="220" height="56" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="33" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">GUEST</text>
    <line x1="220" y1="28" x2="610" y2="28" stroke="#22c55e" stroke-width="2.5"/>
    <rect x="610" y="0" width="220" height="56" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2.5"/>
    <text x="720" y="33" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="12">HOTEL · DIRECT</text>
    <text x="415" y="76" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="11">own booking engine · own guest list · no commission</text>
  </g>

  <!-- Fixed quote chip -->
  <rect x="880" y="120" width="220" height="64" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="905" y="147" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">FIXED MILESTONE QUOTE</text>
  <text x="905" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">after discovery call · 24h</text>

  <text x="600" y="590" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">INTEGRAL LABS // DIRECT BOOKING SYSTEMS · HOSPITALITY</text>
</svg>
