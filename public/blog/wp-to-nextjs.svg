<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Legacy WordPress side -->
  <g transform="translate(90, 170)">
    <rect x="0" y="0" width="430" height="290" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <text x="26" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">WORDPRESS · TODAY</text>
    <g fill="none" stroke="#475569" stroke-width="1.5">
      <rect x="26" y="56" width="120" height="70" rx="6"/>
      <rect x="156" y="56" width="120" height="70" rx="6"/>
      <rect x="286" y="56" width="118" height="70" rx="6"/>
      <rect x="26" y="138" width="120" height="70" rx="6"/>
      <rect x="156" y="138" width="120" height="70" rx="6"/>
      <rect x="286" y="138" width="118" height="70" rx="6"/>
    </g>
    <g stroke="#334155" stroke-width="6" stroke-linecap="round">
      <path d="M 46 86 L 126 86"/>
      <path d="M 176 86 L 256 86"/>
      <path d="M 306 86 L 386 86"/>
      <path d="M 46 168 L 126 168"/>
      <path d="M 176 168 L 256 168"/>
      <path d="M 306 168 L 386 168"/>
    </g>
    <text x="26" y="244" fill="#64748b" font-family="monospace" font-size="11">plugins · shortcodes · page cache</text>
    <text x="26" y="264" fill="#64748b" font-family="monospace" font-size="11">render model you cannot control</text>
  </g>

  <!-- Arrow -->
  <line x1="540" y1="315" x2="650" y2="315" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="595" y="295" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11">REDIRECT MAP</text>

  <!-- Next.js side -->
  <g transform="translate(680, 170)">
    <rect x="0" y="0" width="430" height="290" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="26" y="36" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2">NEXT.JS · SERVED</text>
    <rect x="26" y="56" width="378" height="86" rx="6" fill="#022c22" stroke="#22c55e" stroke-width="1.5"/>
    <text x="46" y="86" fill="#94a3b8" font-family="monospace" font-size="11">SERVER-RENDERED HTML · FIRST PAINT</text>
    <text x="46" y="112" fill="#22c55e" font-family="monospace" font-size="11">TYPES · METADATA · SCHEMA IN CODE</text>
    <rect x="26" y="154" width="180" height="54" rx="6" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="46" y="186" fill="#94a3b8" font-family="monospace" font-size="11">URLS PRESERVED</text>
    <rect x="224" y="154" width="180" height="54" rx="6" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="244" y="186" fill="#94a3b8" font-family="monospace" font-size="11">301s TESTED</text>
    <text x="26" y="244" fill="#64748b" font-family="monospace" font-size="11">same URLs · same signals · faster shell</text>
    <text x="26" y="264" fill="#64748b" font-family="monospace" font-size="11">a surgery, not a haircut</text>
  </g>

  <!-- Fixed quote chip -->
  <rect x="880" y="60" width="220" height="64" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="905" y="87" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">FIXED MILESTONE QUOTE</text>
  <text x="905" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">after discovery call · 24h</text>

  <text x="600" y="545" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">THE REDIRECT MAP IS THE PROJECT</text>
  <text x="600" y="585" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">INTEGRAL LABS // WORDPRESS TO NEXT.JS MIGRATION</text>
</svg>
