<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left panel: rented seats, meter never stops -->
  <g transform="translate(140, 180)">
    <rect x="0" y="0" width="430" height="280" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="30" y="42" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="700">SUBSCRIPTION</text>
    <text x="30" y="66" fill="#64748b" font-family="monospace" font-size="11">pay per seat · every month · forever</text>
    <rect x="30" y="92" width="370" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="45" y="110" fill="#94a3b8" font-family="monospace" font-size="11">YEAR 1 · SEATS</text>
    <rect x="30" y="132" width="370" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="45" y="150" fill="#94a3b8" font-family="monospace" font-size="11">YEAR 2 · SEATS + NEW TIERS</text>
    <rect x="30" y="172" width="370" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="45" y="190" fill="#94a3b8" font-family="monospace" font-size="11">YEAR 3 · SEATS + ADD-ONS</text>
    <text x="30" y="232" fill="#64748b" font-family="monospace" font-size="11">year-three headcount decides it,</text>
    <text x="30" y="252" fill="#64748b" font-family="monospace" font-size="11">not today's team</text>
  </g>

  <!-- Right panel: owned, paid once -->
  <g transform="translate(630, 180)">
    <rect x="0" y="0" width="430" height="280" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="30" y="42" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="700">OWNED BUILD</text>
    <text x="30" y="66" fill="#64748b" font-family="monospace" font-size="11">paid once · 100% code + data ownership</text>
    <rect x="30" y="92" width="370" height="60" rx="6" fill="#022c22" stroke="#22c55e" stroke-width="1.5"/>
    <text x="45" y="118" fill="#22c55e" font-family="monospace" font-size="12">BUILD · ONE MILESTONE PLAN</text>
    <text x="45" y="140" fill="#94a3b8" font-family="monospace" font-size="11">your formats · your approvals · your GST</text>
    <text x="30" y="196" fill="#94a3b8" font-family="monospace" font-size="11">+ hosting and support after</text>
    <text x="30" y="232" fill="#64748b" font-family="monospace" font-size="11">a permanent asset: extend it,</text>
    <text x="30" y="252" fill="#64748b" font-family="monospace" font-size="11">sell it, hand it to a successor</text>
  </g>

  <!-- Fixed quote chip -->
  <rect x="880" y="60" width="220" height="64" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="905" y="87" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">FIXED MILESTONE QUOTE</text>
  <text x="905" y="110" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">after discovery call · 24h</text>

  <text x="600" y="560" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">RENT A WORKFLOW, OR OWN THE MACHINE</text>
  <text x="600" y="590" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">INTEGRAL LABS // CRM OWNERSHIP DECISION · INDIA</text>
</svg>
