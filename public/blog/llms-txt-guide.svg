    <text x="25" y="205" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14">✔ pages prioritized</text>
    <text x="25" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14">✔ cited in answers</text>
    <text x="25" y="285" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">ChatGPT · Perplexity · Claude · Gemini</text>
