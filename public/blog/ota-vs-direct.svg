<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="110" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3">NET REVENUE = RATE - CHANNEL - PROCESSING - MARKETING</text>

  <!-- OTA line: stepped down -->
  <g transform="translate(120, 160)">
    <text x="0" y="0" fill="#f59e0b" font-family="monospace" font-size="12">THROUGH THE OTA</text>
    <line x1="0" y1="250" x2="440" y2="250" stroke="#334155" stroke-width="2"/>
    <polyline points="0,40 70,40 70,86 140,86 140,132 210,132 210,178 280,178 280,210 350,210 350,225 420,225"
              fill="none" stroke="#f59e0b" stroke-width="3"/>
    <g stroke="#f59e0b" stroke-width="1" opacity="0.5">
      <line x1="70" y1="40" x2="70" y2="86"/>
      <line x1="140" y1="86" x2="140" y2="132"/>
      <line x1="210" y1="132" x2="210" y2="178"/>
    </g>
    <text x="0" y="286" fill="#64748b" font-family="monospace" font-size="11">commission on every booking,</text>
    <text x="0" y="306" fill="#64748b" font-family="monospace" font-size="11">including repeat guests</text>
  </g>

  <!-- Direct line: flat -->
  <g transform="translate(700, 160)">
    <text x="0" y="0" fill="#22c55e" font-family="monospace" font-size="12">BOOKED DIRECT</text>
    <line x1="0" y1="250" x2="440" y2="250" stroke="#334155" stroke-width="2"/>
    <polyline points="0,40 70,48 140,44 210,52 280,50 350,58 420,56" fill="none" stroke="#22c55e" stroke-width="3"/>
    <text x="0" y="286" fill="#64748b" font-family="monospace" font-size="11">guest relationship owned,</text>
    <text x="0" y="306" fill="#64748b" font-family="monospace" font-size="11">second stay costs less</text>
  </g>

  <!-- Divider -->
  <line x1="600" y1="180" x2="600" y2="400" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 8"/>

  <!-- Three lines panel -->
  <g transform="translate(300, 440)">
    <rect x="0" y="0" width="600" height="86" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="30" fill="#94a3b8" font-family="monospace" font-size="12">1  WHAT THE GUEST PAYS</text>
    <text x="24" y="54" fill="#94a3b8" font-family="monospace" font-size="12">2  WHAT THE CHANNEL KEEPS</text>
    <text x="24" y="78" fill="#94a3b8" font-family="monospace" font-size="12">3  WHAT IT COST TO EARN THE BOOKING</text>
    <text x="360" y="54" fill="#22c55e" font-family="monospace" font-size="11">TRACK THE DIRECT SHARE</text>
    <text x="360" y="78" fill="#64748b" font-family="monospace" font-size="11">MONTHLY, NOT PER SEASON</text>
  </g>

  <text x="600" y="580" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">INTEGRAL LABS // OTA COMMISSION VS DIRECT BOOKINGS</text>
</svg>
