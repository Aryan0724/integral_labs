<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Big numeral -->
  <text x="110" y="360" fill="#2563eb" font-family="system-ui, sans-serif" font-size="300" font-weight="800">16</text>
  <text x="120" y="410" fill="#64748b" font-family="system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="2">NEXT.JS</text>

  <!-- App Router file tree -->
  <g transform="translate(440, 110)">
    <rect x="0" y="0" width="380" height="360" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <text x="25" y="45" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">app/</text>
    <text x="45" y="80" fill="#ffffff" font-family="monospace" font-size="13">layout.tsx      → React Server</text>
    <text x="45" y="110" fill="#ffffff" font-family="monospace" font-size="13">page.tsx        → RSC / SSG</text>
    <text x="45" y="140" fill="#ffffff" font-family="monospace" font-size="13">opengraph.tsx   → ImageResponse</text>
    <text x="45" y="170" fill="#ffffff" font-family="monospace" font-size="13">proxy.ts        → edge gateway</text>
    <text x="45" y="200" fill="#ffffff" font-family="monospace" font-size="13">api/*/route.ts  → route handlers</text>
    <text x="45" y="240" fill="#94a3b8" font-family="monospace" font-size="12" font-style="italic">server-first · streaming ·</text>
    <text x="45" y="262" fill="#94a3b8" font-family="monospace" font-size="12" font-style="italic">static by default</text>
    <rect x="0" y="324" width="380" height="36" rx="0" fill="#1e293b"/>
    <text x="25" y="348" fill="#38bdf8" font-family="monospace" font-size="13">▲ turbopack · build 10s</text>
  </g>

  <!-- Production checklist -->
  <g transform="translate(880, 120)">
    <rect x="0" y="0" width="240" height="340" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PRODUCTION RULES</text>
    <rect x="25" y="60" width="190" height="6" rx="3" fill="#1e293b"/>
    <text x="25" y="95" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ cache boundaries</text>
    <text x="25" y="130" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ metadataBase set</text>
    <text x="25" y="165" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ streaming routes</text>
    <text x="25" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ edge-safe libs</text>
    <text x="25" y="235" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ typed params</text>
    <text x="25" y="270" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13">✔ CWV budgets</text>
  </g>

  <text x="600" y="570" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">INTEGRAL LABS // NEXT.JS 16 APP ROUTER IN PRODUCTION</text>
</svg>
