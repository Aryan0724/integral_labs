<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Himalayan ridge line (Uttarakhand motif) -->
  <path d="M 60 300 L 200 180 L 320 260 L 470 140 L 600 250 L 760 170 L 900 280 L 1040 210 L 1140 300" fill="none" stroke="#1e3a5f" stroke-width="3"/>
  <circle cx="470" cy="140" r="6" fill="#38bdf8"/>

  <!-- Scope levers instead of price tags -->
  <g transform="translate(140, 340)">
    <rect x="0" y="0" width="920" height="210" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <text x="30" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">WHAT ACTUALLY MOVES A PROJECT QUOTE</text>

    <text x="30" y="85" fill="#94a3b8" font-family="monospace" font-size="13">SCOPE</text>
    <rect x="130" y="72" width="560" height="14" rx="7" fill="#2563eb"/>
    <text x="30" y="125" fill="#94a3b8" font-family="monospace" font-size="13">INTEGRATIONS</text>
    <rect x="130" y="112" width="420" height="14" rx="7" fill="#3b82f6"/>
    <text x="30" y="165" fill="#94a3b8" font-family="monospace" font-size="13">CONTENT</text>
    <rect x="130" y="152" width="300" height="14" rx="7" fill="#3b82f6"/>
    <text x="30" y="205" fill="#94a3b8" font-family="monospace" font-size="13">SUPPORT</text>
    <rect x="130" y="192" width="200" height="14" rx="7" fill="#334155"/>
  </g>

  <!-- Fixed quote chip -->
  <rect x="880" y="120" width="220" height="64" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="905" y="147" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">FIXED MILESTONE QUOTE</text>
  <text x="905" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">after discovery call · 24h</text>

  <text x="600" y="570" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">INTEGRAL LABS // SCOPED PROJECT PRICING · UTTARAKHAND</text>
</svg>
