<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- CRM pipeline motif -->
  <g transform="translate(140, 120)">
    <rect x="0" y="0" width="170" height="52" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <text x="85" y="31" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">LEAD</text>
    <line x1="170" y1="26" x2="215" y2="26" stroke="#334155" stroke-width="2"/>
    <rect x="215" y="0" width="170" height="52" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="31" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">QUALIFIED</text>
    <line x1="385" y1="26" x2="430" y2="26" stroke="#334155" stroke-width="2"/>
    <rect x="430" y="0" width="170" height="52" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="515" y="31" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="12">QUOTATION</text>
    <line x1="600" y1="26" x2="645" y2="26" stroke="#334155" stroke-width="2"/>
    <rect x="645" y="0" width="170" height="52" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="730" y="31" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="12">WON</text>
  </g>

  <!-- Cost levers instead of price tags -->
  <g transform="translate(140, 280)">
    <rect x="0" y="0" width="920" height="250" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <text x="30" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">WHAT ACTUALLY MOVES A CRM BUILD QUOTE</text>

    <text x="30" y="82" fill="#94a3b8" font-family="monospace" font-size="13">PROCESS</text>
    <rect x="140" y="69" width="540" height="14" rx="7" fill="#2563eb"/>
    <text x="30" y="122" fill="#94a3b8" font-family="monospace" font-size="13">INTEGRATIONS</text>
    <rect x="140" y="109" width="440" height="14" rx="7" fill="#3b82f6"/>
    <text x="30" y="162" fill="#94a3b8" font-family="monospace" font-size="13">MIGRATION</text>
    <rect x="140" y="149" width="330" height="14" rx="7" fill="#3b82f6"/>
    <text x="30" y="202" fill="#94a3b8" font-family="monospace" font-size="13">USERS + ROLES</text>
    <rect x="140" y="189" width="240" height="14" rx="7" fill="#334155"/>
    <text x="30" y="232" fill="#94a3b8" font-family="monospace" font-size="13">SUPPORT</text>
    <rect x="140" y="219" width="180" height="14" rx="7" fill="#334155"/>
  </g>

  <!-- Fixed quote chip -->
  <rect x="880" y="120" width="220" height="64" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="905" y="147" fill="#22c55e" font-family="system-ui, sans-serif" font-size="13" font-weight="700">FIXED MILESTONE QUOTE</text>
  <text x="905" y="170" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">after discovery call · 24h</text>

  <text x="600" y="590" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">INTEGRAL LABS // CUSTOM CRM COST DRIVERS · INDIA</text>
</svg>
