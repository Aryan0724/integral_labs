<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(150, 140)">
    <rect width="900" height="350" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="50" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">CORE WEB VITALS BENCHMARKS</text>
    <text x="50" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="700">LCP, INP, and CLS Engineering Thresholds</text>
    
    <!-- LCP Card -->
    <g transform="translate(50, 130)">
      <rect width="240" height="170" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="25" y="40" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">LCP &lt; 2.5s</text>
      <text x="25" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Largest Contentful Paint</text>
      <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Measures Loading Performance</text>
      <text x="25" y="130" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Next.js SSR & Edge Caching</text>
      <text x="25" y="150" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Optimal: &lt; 1.2s</text>
    </g>

    <!-- INP Card -->
    <g transform="translate(330, 130)">
      <rect width="240" height="170" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="25" y="40" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">INP &lt; 200ms</text>
      <text x="25" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Interaction to Next Paint</text>
      <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Measures Visual Responsiveness</text>
      <text x="25" y="130" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Minimal Main-Thread Blocking</text>
      <text x="25" y="150" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Optimal: &lt; 50ms</text>
    </g>

    <!-- CLS Card -->
    <g transform="translate(610, 130)">
      <rect width="240" height="170" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="25" y="40" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CLS &lt; 0.1</text>
      <text x="25" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Cumulative Layout Shift</text>
      <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Measures Visual Stability</text>
      <text x="25" y="130" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Dimensioned Media & Font Fallbacks</text>
      <text x="25" y="150" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Optimal: 0.00</text>
    </g>
  </g>

  <text x="600" y="570" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">INTEGRAL LABS // PERFORMANCE ENGINEERING</text>
</svg>
