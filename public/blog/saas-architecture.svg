<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(150, 140)">
    <rect width="900" height="350" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="50" y="55" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">SAAS PRODUCT ENGINEERING</text>
    <text x="50" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Multi-Tenancy & Resilient Architecture</text>
    
    <!-- 3 Pillars of SaaS -->
    <g transform="translate(50, 130)">
      <rect width="240" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="25" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">01 / DATA ISOLATION</text>
      <text x="25" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Tenant Partitioning</text>
      <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Row-Level Security (RLS)</text>
      <text x="25" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Isolated Schema Migrations</text>
      <text x="25" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Audit Trails & Encryption</text>
    </g>

    <g transform="translate(330, 130)">
      <rect width="240" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="25" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">02 / BILLING ENGINE</text>
      <text x="25" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Idempotent Webhooks</text>
      <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Proration & Upgrades</text>
      <text x="25" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Seat-Based Entitlements</text>
      <text x="25" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Automated Dunning</text>
    </g>

    <g transform="translate(610, 130)">
      <rect width="240" height="170" rx="10" fill="#1e293b" stroke="#2563eb" stroke-width="1.5"/>
      <text x="25" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">03 / IP OWNERSHIP</text>
      <text x="25" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Zero Lock-In</text>
      <text x="25" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">100% Client Codebase</text>
      <text x="25" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Standard Next / Node / SQL</text>
      <text x="25" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Portable Cloud Config</text>
    </g>
  </g>

  <text x="600" y="570" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">INTEGRAL LABS // SAAS PRODUCT ENGINEERING</text>
</svg>
