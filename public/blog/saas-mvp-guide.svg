<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- MVP pipeline -->
  <g transform="translate(110, 150)">
    <rect x="0" y="80" width="140" height="90" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <text x="20" y="115" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">01</text>
    <text x="20" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">One riskiest</text>
    <text x="20" y="158" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">assumption</text>

    <path d="M 140 125 L 190 125" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 3"/>

    <rect x="190" y="80" width="150" height="90" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <text x="210" y="115" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">02</text>
    <text x="210" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Scope one</text>
    <text x="210" y="158" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">workflow whole</text>

    <path d="M 340 125 L 390 125" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 3"/>

    <rect x="390" y="80" width="140" height="90" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="410" y="115" fill="#22c55e" font-family="monospace" font-size="12" font-weight="700">03</text>
    <text x="410" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Staging</text>
    <text x="410" y="158" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">week one</text>

    <path d="M 530 125 L 580 125" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 3"/>

    <rect x="580" y="80" width="150" height="90" rx="12" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="600" y="115" fill="#22c55e" font-family="monospace" font-size="12" font-weight="700">04</text>
    <text x="600" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Pilot users</text>
    <text x="600" y="158" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">weekly demos</text>

    <path d="M 730 125 L 780 125" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 3"/>

    <rect x="780" y="80" width="130" height="90" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="800" y="115" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">05</text>
    <text x="800" y="140" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Launch —</text>
    <text x="800" y="158" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">evidence in</text>

    <!-- Feedback arrow back -->
    <path d="M 845 80 C 845 30 500 30 70 80" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="440" y="18" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">evidence orders the next milestone</text>
  </g>

  <!-- Stack panel -->
  <g transform="translate(110, 380)">
    <rect x="0" y="0" width="920" height="140" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="40" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DECISIONS ALREADY MADE BEFORE THE FIRST CALL</text>
    <text x="30" y="75" fill="#ffffff" font-family="monospace" font-size="14">Next.js 16 App Router · React 19 RSC · Postgres</text>
    <text x="30" y="105" fill="#94a3b8" font-family="monospace" font-size="13">payments ready · typed end-to-end · you own code + domain + infra</text>
  </g>

  <text x="600" y="580" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">INTEGRAL LABS // SAAS MVP ENGINEERING PLAYBOOK</text>
</svg>
