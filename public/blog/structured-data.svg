<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Knowledge Graph Nodes -->
  <g transform="translate(180, 160)">
    <!-- Node 1: Organization -->
    <rect x="0" y="80" width="220" height="120" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="2"/>
    <text x="25" y="115" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">@type: Organization</text>
    <text x="25" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Integral Labs</text>
    <text x="25" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">parentOrg: Integral Groups</text>

    <!-- Connector lines -->
    <path d="M 220 140 L 360 70" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 2"/>
    <path d="M 220 140 L 360 210" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Node 2: WebSite -->
    <rect x="360" y="10" width="220" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">@type: WebSite</text>
    <text x="25" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">labs.integralgroups.in</text>
    <text x="25" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">canonical publisher node</text>

    <!-- Node 3: Engineering Collective -->
    <rect x="360" y="160" width="220" height="110" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="195" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">@type: Organization</text>
    <text x="25" y="225" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Engineering Collective</text>
    <text x="25" y="248" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Integral Labs Core Team</text>

    <!-- Node 4: Article -->
    <path d="M 580 65 L 670 140" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="670" y="80" width="240" height="120" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="115" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">@type: BlogPosting</text>
    <text x="25" y="145" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Structured Data Guide</text>
    <text x="25" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">author: #collective / publisher: #org</text>
  </g>

  <text x="600" y="570" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">INTEGRAL LABS // SCHEMA &amp; KNOWLEDGE GRAPH ARCHITECTURE</text>
</svg>
