<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left Side: Traditional Search Crawler -->
  <g transform="translate(140, 150)">
    <rect width="400" height="330" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">TRADITIONAL SEARCH (SEO)</text>
    <text x="30" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Crawler & Index Parser</text>
    
    <path d="M 30 115 L 370 115" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Link list items -->
    <rect x="30" y="140" width="340" height="40" rx="6" fill="#1e293b" opacity="0.8"/>
    <rect x="45" y="155" width="180" height="10" rx="3" fill="#38bdf8" />
    <rect x="300" y="155" width="55" height="10" rx="3" fill="#64748b" />

    <rect x="30" y="195" width="340" height="40" rx="6" fill="#1e293b" opacity="0.5"/>
    <rect x="45" y="210" width="140" height="10" rx="3" fill="#64748b" />
    <rect x="300" y="210" width="55" height="10" rx="3" fill="#475569" />

    <rect x="30" y="250" width="340" height="40" rx="6" fill="#1e293b" opacity="0.3"/>
    <rect x="45" y="265" width="160" height="10" rx="3" fill="#475569" />

    <text x="30" y="312" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Output: 10 Blue Links & Meta Descriptions</text>
  </g>

  <!-- Transition Arrows / Bridge -->
  <g transform="translate(565, 290)">
    <circle cx="35" cy="25" r="28" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 24 25 L 46 25 M 38 17 L 46 25 L 38 33" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Side: Answer Engine Synthesis -->
  <g transform="translate(660, 150)">
    <rect width="400" height="330" rx="12" fill="#0f172a" stroke="#2563eb" stroke-width="2" />
    <text x="30" y="50" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ANSWER ENGINES (AEO)</text>
    <text x="30" y="85" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Entity Synthesis & Direct Answer</text>
    
    <path d="M 30 115 L 370 115" stroke="#1e293b" stroke-width="1"/>

    <!-- Synthesized answer box -->
    <rect x="30" y="140" width="340" height="105" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 2"/>
    <rect x="45" y="160" width="310" height="10" rx="3" fill="#e2e8f0" />
    <rect x="45" y="180" width="280" height="10" rx="3" fill="#cbd5e1" />
    <rect x="45" y="200" width="210" height="10" rx="3" fill="#94a3b8" />
    <rect x="45" y="223" width="90" height="14" rx="4" fill="#2563eb" />
    <text x="52" y="234" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">[1] CITED SOURCE</text>

    <text x="30" y="280" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Structured Data + Knowledge Graph Authority</text>
    <text x="30" y="312" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Output: Direct Natural Language Synthesis</text>
  </g>

  <!-- Brand watermark -->
  <text x="600" y="570" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="3">INTEGRAL LABS // SEARCH & AEO ENGINEERING</text>
</svg>
